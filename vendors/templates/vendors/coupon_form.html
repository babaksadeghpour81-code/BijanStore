{% extends 'vendors/base_vendor.html' %}
{% block title %}کد تخفیف جدید{% endblock %}

{% block vendor_content %}
<h1 class="page-title">🏷️ کد تخفیف جدید</h1>

<form method="post" class="product-form">
    {% csrf_token %}

    <div class="form-group">
        <label>کد تخفیف (حروف انگلیسی و اعداد)</label>
        <input type="text" name="code" class="form-input" required
               placeholder="مثلاً: SUMMER2025" style="text-transform:uppercase;">
    </div>

    <div class="form-group">
        <label>نوع تخفیف</label>
        <select name="discount_type" class="form-input">
            <option value="percent">درصدی</option>
            <option value="fixed">مبلغ ثابت</option>
        </select>
    </div>

    <div class="form-group">
        <label>مقدار تخفیف</label>
        <input type="number" name="discount_value" class="form-input" required min="1">
        <small class="help">برای درصدی: عدد بین ۱ تا ۱۰۰ / برای مبلغ ثابت: به تومان</small>
    </div>

    <div class="form-group">
        <label>حداقل مبلغ خرید (تومان)</label>
        <input type="number" name="min_purchase" class="form-input" value="0" min="0">
    </div>

    <div class="form-group">
        <label>سقف تخفیف (فقط برای درصدی، اختیاری)</label>
        <input type="number" name="max_discount" class="form-input" min="0">
    </div>

    <div class="form-group">
        <label>حداکثر تعداد استفاده (۰ = نامحدود)</label>
        <input type="number" name="max_uses" class="form-input" value="0" min="0">
    </div>

    <div class="form-group">
        <label>تاریخ شروع اعتبار</label>
        <input type="datetime-local" name="valid_from" class="form-input" required>
    </div>

    <div class="form-group">
        <label>تاریخ پایان اعتبار</label>
        <input type="datetime-local" name="valid_until" class="form-input" required>
    </div>

    <div style="display:flex; gap:10px;">
        <button type="submit" class="btn-primary" style="width:auto; padding:10px 25px;">ایجاد</button>
        <a href="{% url 'vendors:coupon_list' %}" class="btn-checkout" style="background:#6c757d;">انصراف</a>
    </div>
</form>
{% endblock %}

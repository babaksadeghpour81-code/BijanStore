{% extends 'dashboard/base_dashboard.html' %}
{% block title %}حذف دسته‌بندی{% endblock %}

{% block admin_content %}
<div class="confirm-box">
    <h2>🗑️ حذف دسته‌بندی</h2>
    <p>
        آیا از حذف دسته‌بندی «<strong>{{ category.name }}</strong>» مطمئنی؟
        این عملیات قابل بازگشت نیست.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-remove" style="padding:10px 25px;">بله، حذف کن</button>
        <a href="{% url 'dashboard:category_list' %}" class="btn-small"
           style="padding:10px 25px; text-decoration:none;">انصراف</a>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>🔐 تغییر رمز عبور</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="field-error">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn-primary">ذخیره رمز جدید</button>
    </form>
    <p class="auth-alt"><a href="{% url 'accounts:profile' %}">بازگشت به پروفایل</a></p>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>🔐 بازیابی رمز عبور</h2>
    <p style="color:#666; font-size:14px; margin-bottom:20px;">
        ایمیل خود را وارد کنید. لینک بازیابی برای شما ارسال می‌شود.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email">ایمیل</label>
            <input type="email" name="email" id="id_email"
                   class="form-input" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn-primary">ارسال لینک بازیابی</button>
    </form>

    <p class="auth-alt">
        <a href="{% url 'accounts:login' %}">بازگشت به ورود</a>
    </p>
</div>
{% endblock %}
